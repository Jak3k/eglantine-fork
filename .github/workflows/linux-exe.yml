name: Linux x64 package

on:
  workflow_dispatch:
  push:
    branches: [eglantine-time, oot-performance-lab]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/windows-exe.yml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          platform: linux-x86_64
          sha: ${{ github.sha }}
          refspec: ${{ github.ref_name }}
          tag: eglantine-time
          release: false
          save-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache libvulkan1 mesa-vulkan-drivers \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true
      - name: Configure
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DYUZU_TESTS=ON \
            -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON -DNIGHTLY_BUILD=OFF
      - name: Build GUI, CLI and tests
        run: |
          cmake --build build/linux --target yuzu yuzu-cmd tests --parallel 2
          ccache --show-stats
      - name: Run core and shader tests
        run: ctest --test-dir build/linux --output-on-failure
      - name: Check executable startup
        run: |
          set -euo pipefail
          mkdir -p verification
          timeout 30s build/linux/bin/eglantine-time-cli --help > verification/cli.txt 2>&1
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10s build/linux/bin/eglantine-time --help > verification/gui.txt 2>&1
          result=$?
          set -e
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then
            cat verification/gui.txt
            exit "$result"
          fi
          ldd build/linux/bin/eglantine-time > verification/gui-libraries.txt
          ldd build/linux/bin/eglantine-time-cli > verification/cli-libraries.txt
          if grep -q 'not found' verification/*libraries.txt; then
            cat verification/*libraries.txt
            exit 1
          fi
      - name: Package binaries and corresponding source
        run: |
          set -euo pipefail
          mkdir -p package release-assets
          install -m755 build/linux/bin/eglantine-time build/linux/bin/eglantine-time-cli package/
          strip package/eglantine-time package/eglantine-time-cli
          cp LICENSE.txt cpmfile.json docs/Eglantine-Time-linux.md package/
          cp -r LICENSES package/
          printf 'Source: https://github.com/%s/tree/%s\nBuild: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > package/SOURCE.txt
          tar -czf "release-assets/eglantine-time-linux-x64-${GITHUB_SHA:0:12}.tar.gz" -C package .
          git archive --format=zip --output=release-assets/eglantine-time-source.zip HEAD
          (cd release-assets && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: verified-linux-release-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-test-results-${{ github.sha }}
          path: |
            verification/
            build/linux/Testing/Temporary/
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-linux-release-${{ github.sha }}
          path: release-assets
      - name: Publish Linux prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="eglantine-time-test-linux-${GITHUB_SHA:0:12}"
          printf 'Performance-lab Linux x86-64 TEST build from commit `%s`.\n\nGUI/CLI compilation, core/shader tests and bounded startup checks passed. Includes Zelda Dynamic FPS (CPU Clock Normal and Sync Core Speed off), contiguous GPU-range reuse, lichii-custom SSA optimization and the Mario Kart World cache-directory fix. The optional preset uses Accurate on Linux and Fast on Windows. Linux gameplay performance is untested.\n\nThe tarball needs Qt 6.8.3 and system libraries; it is not an AppImage. Build instructions and matching source are included.\n\nBuild: https://github.com/%s/actions/runs/%s\n\nAssisted by Codex; publication authorized by the repository owner.\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          gh release create "$tag" release-assets/*.tar.gz release-assets/*.zip release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Eglantine-Time Linux x64 ${GITHUB_SHA:0:12}" \
            --notes-file release-notes.md --prerelease --latest=false
